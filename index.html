<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1410" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>揭层</title>
    <meta name="description" content="全屏双层揭图小游戏：刮开、撕纸、擦雾、揭贴纸、碎裂。" />
    <link rel="icon" href="./icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script type="module" crossorigin src="./assets/index-B2xfXUM6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-BZ4_2fWD.css">
  </head>
  <body>
    <div id="app">
  <div id="select-screen" class="select">
    <header class="select__bar">
      <div class="select__titles">
        <h1 data-text="title"></h1>
        <p id="select-progress"></p>
      </div>
      <div class="select__actions">
        <button id="select-random" type="button" data-text="random"></button>
        <button id="select-fullscreen" type="button" data-text="fullscreen"></button>
      </div>
    </header>
    <div id="level-grid" class="select__grid" role="list"></div>
  </div>
  <canvas id="stage" aria-label="揭层画布"></canvas>
  <div id="hint" class="hint" role="status">
    <strong id="hint-title"></strong>
    <span id="hint-copy" data-text="hint"></span>
  </div>
  <button id="menu-toggle" type="button" class="fab" aria-expanded="false" aria-controls="toolbar">
    <span class="fab__icon" aria-hidden="true"></span>
    <span class="visually-hidden" data-text="menu"></span>
  </button>
  <div id="toolbar" class="toolbar" role="toolbar">
    <button id="open-select" type="button" data-text="openLevels"></button>
    <label class="field">
      <span data-text="effect"></span>
      <select id="effect"></select>
    </label>
    <label class="field" id="brush-field">
      <span data-text="brush"></span>
      <input id="brush" type="range" min="18" max="92" value="42" />
    </label>
    <button id="reset" type="button" data-text="reset"></button>
    <button id="fullscreen" type="button" data-text="fullscreen"></button>
  </div>
  <div id="complete" class="complete" hidden>
    <h2 data-text="revealed"></h2>
    <div class="complete__actions">
      <button id="back-select" type="button" data-text="backSelect"></button>
      <button id="next-level" type="button" data-text="nextLevel"></button>
      <button id="random-level" type="button" data-text="random"></button>
      <button id="replay-complete" type="button" data-text="reset"></button>
    </div>
  </div>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
</div>

  </body>
</html>
